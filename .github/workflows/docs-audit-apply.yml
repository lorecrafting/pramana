name: Apply documentation audit

# One-shot, branch-contained migration tooling. Removed by the migration.
on:
  push:
    branches: [docs/provider-neutral-audit-2026-09-15]
    paths: [.github/workflows/docs-audit-apply.yml]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/docs/provider-neutral-audit-2026-09-15'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.3-otp-29'
      - name: Verify exact source and migration, then apply
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib, subprocess
          baseline = '75a56c13ebafa0ab7e67f2cf12f47ad84aad2ebc'
          allowed = {'.github/workflows/docs-audit-snapshot.yml', '.github/workflows/docs-audit-apply.yml'}
          allowed.update(f'.github/docs-audit-part{i}.b64' for i in range(1, 5))
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', baseline, 'HEAD'], text=True).splitlines())
          assert changed <= allowed, f'Unexpected concurrent source changes: {changed - allowed}'
          parts = [Path(f'.github/docs-audit-part{i}.b64').read_text().strip() for i in range(1, 5)]
          # Correct one identified transport-only duplicated character; the complete
          # decoded program must still match the locally reviewed SHA-256 exactly.
          assert parts[0].count('C8UZVZZz') == 1
          parts[0] = parts[0].replace('C8UZVZZz', 'C8UZVZz')
          source = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(source).hexdigest() == 'ed873684f484d89b43cf5fa0bc2df7d7a0fad039ba2f7ce571da1559ce6f6287'
          script = Path('/tmp/pramana-docs-audit-apply.py')
          script.write_bytes(source)
          subprocess.run(['python', str(script), '.'], check=True)
          PY
      - name: Format standalone Elixir checks
        run: |
          elixir -e 'for p <- ["apps/pramana/test/docs/routing_test.exs", "apps/pramana/test/docs/tasks_test.exs", "bin/check_docs.exs"], do: File.write!(p, [Code.format_string!(File.read!(p)), "\n"])'
      - name: Stage only audited paths and run model-free checks
        shell: bash
        run: |
          set -euo pipefail
          git add --pathspec-from-file=/tmp/pramana-docs-audit-paths --pathspec-file-nul
          elixir bin/check_docs.exs
          git diff --cached --check
          git diff --cached --stat
      - name: Commit to this branch only, without overwriting concurrent work
        shell: bash
        env:
          AUDIT_BRANCH: docs/provider-neutral-audit-2026-09-15
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/$AUDIT_BRANCH" | cut -f1)
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: audit source contracts and route provider-neutral chaptered references'
          git push origin "HEAD:refs/heads/$AUDIT_BRANCH"
      - name: Capture candidate source and check output
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/docs-audit-result"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-audit-result/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/docs-audit-result/tree.txt"
          git status --porcelain > "$RUNNER_TEMP/docs-audit-result/status.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/docs-audit-result/source.tar"
          git diff --cached --binary > "$RUNNER_TEMP/docs-audit-result/uncommitted.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: documentation-audit-result
          path: ${{ runner.temp }}/docs-audit-result
          if-no-files-found: error
          retention-days: 1
