name: Foundry CI

on:
  push:
    branches: [main]
    paths:
      - "foundry/**"
      - ".github/workflows/foundry-ci.yml"
      - "mise.toml"
  pull_request:
    paths:
      - "foundry/**"
      - ".github/workflows/foundry-ci.yml"
      - "mise.toml"

permissions:
  contents: read

concurrency:
  group: foundry-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: foundry

    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install pinned BEAM toolchain
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      - name: Run isolated model-free Foundry checks
        run: elixir ci/run.exs --output "$RUNNER_TEMP/foundry-ci-artifacts"

      - name: Upload build provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: foundry-ci-${{ github.sha }}
          path: ${{ runner.temp }}/foundry-ci-artifacts
          if-no-files-found: error
          retention-days: 14
