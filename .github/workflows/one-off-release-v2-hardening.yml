name: One-off release v2 fingerprint hardening

on:
  push:
    branches:
      - fix/release-content-identity-v2-2026-09-16

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-content-identity-v2-2026-09-16
          fetch-depth: 0

      - name: Include actual stored text in v2 fingerprints
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("pramana/apps/pramana/lib/pramana/release.ex")
          text = path.read_text()

          old = "                    ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?\n"
          new = "                    ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?\n"
          if text.count(old) != 1:
              raise SystemExit(f"translation placeholder match count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "            t.method,\n            t.text_sha256,\n"
          new = "            t.method,\n            t.text,\n            t.text_sha256,\n"
          if text.count(old) != 1:
              raise SystemExit(f"translation field match count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "                    ?, ?, ?, ?, ?, ?, ?,\n                    CASE\n"
          new = "                    ?, ?, ?, ?, ?, ?, ?, ?,\n                    CASE\n"
          if text.count(old) != 1:
              raise SystemExit(f"vector placeholder match count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "            v.translator_id,\n            v.content_sha256,\n"
          new = "            v.translator_id,\n            v.content,\n            v.content_sha256,\n"
          if text.count(old) != 1:
              raise SystemExit(f"vector field match count: {text.count(old)}")
          text = text.replace(old, new, 1)

          old = "  # Stable row fields only. Surrogate ids and timestamps are deliberately excluded: two\n"
          new = (
              "  # Stable row fields only. Actual stored text travels beside its recorded hash, so an\n"
              "  # inconsistent hash column cannot mask a content change. Surrogate ids and timestamps\n"
              "  # are deliberately excluded: two\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f"translation comment match count: {text.count(old)}")
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path("pramana/apps/pramana/test/pramana/release_content_identity_v2_test.exs")
          text = test.read_text()
          anchor = "  test \"a no-op translation rewrite does not manufacture content drift\" do\n"
          block = (
              "  test \"actual rendering text participates even when its adjacent hash is stale\" do\n"
              "    rendering!(\"Original rendering\")\n"
              "    {:ok, before} = Release.stamp()\n"
              "    changed_at = DateTime.add(DateTime.utc_now(), 1, :second)\n\n"
              "    Repo.update_all(Pramana.Corpus.Translation,\n"
              "      set: [text: \"Tampered rendering\", updated_at: changed_at]\n"
              "    )\n\n"
              "    # Deliberately leave text_sha256 untouched. The v1-style trust in the adjacent hash\n"
              "    # would miss this; v2 fingerprints the actual stored text as well.\n"
              "    assert %{translation_set_id: %{stamped: stamped, live: live}} = Release.drift()\n"
              "    assert stamped == before.translation_set_id\n"
              "    refute live == stamped\n"
              "  end\n\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"test anchor match count: {text.count(anchor)}")
          test.write_text(text.replace(anchor, block + anchor, 1))
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pramana/apps/pramana/lib/pramana/release.ex \
            pramana/apps/pramana/test/pramana/release_content_identity_v2_test.exs
          git commit -m "fix: hash actual stored release content"
          git push origin HEAD:fix/release-content-identity-v2-2026-09-16
