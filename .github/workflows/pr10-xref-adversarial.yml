name: PR 10 isolated xref adversarial probes
on:
  push:
    branches: [review/pr10-xref-adversarial-2026-09-16]
    paths: [.github/workflows/pr10-xref-adversarial.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 734541768db1afda902867cf47f16730f1bc564b
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
      - name: Run exact collector in throwaway compiler fixtures
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 734541768db1afda902867cf47f16730f1bc564b
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tempfile, textwrap
          checkout = pathlib.Path.cwd()
          workflow = (checkout / '.github/workflows/ci.yml').read_text()
          section = workflow.split('      - name: Export compiler dependency reports\n', 1)[1]
          collector = textwrap.dedent(section.split('        run: |\n', 1)[1].split('\n      - name: Upload compiler dependency reports', 1)[0])
          runbook = (checkout / 'docs/agents/DEPENDENCY_REVIEW.md').read_text()
          caller_command = runbook.split('## Find callers across the application boundary\n', 1)[1].split('```sh\n', 1)[1].split('```', 1)[0]
          work = pathlib.Path(tempfile.mkdtemp(prefix='pr10-review-', dir=os.environ['RUNNER_TEMP']))
          print('Candidate: 734541768db1afda902867cf47f16730f1bc564b', flush=True)
          print('Collector SHA256:', hashlib.sha256(collector.encode()).hexdigest(), flush=True)
          def run(argv, cwd, env=None, check=True):
              p = subprocess.run(argv, cwd=cwd, env=env, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if check and p.returncode:
                  raise RuntimeError(f'{argv}: exit {p.returncode}\n{p.stdout}')
              return p
          def put(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
          summary = []
          for name in ['baseline', 'outside-app', 'ignored-generated', 'empty-application']:
              root = work / name
              project = root / 'pramana'
              app = project / 'apps/demo'
              paths = '["lib"]'
              if name == 'outside-app':
                  paths = '["lib", Path.expand("../../../outside", __DIR__)]'
                  put(root / 'outside/external.ex', 'defmodule Review.External do\n  def run, do: Pramana.Release.current_id()\nend\n')
              if name == 'ignored-generated':
                  paths = '["lib", "generated"]'
                  put(app / 'generated/generated.ex', 'defmodule Review.Generated do\n  def run, do: Pramana.Release.current_id()\nend\n')
              put(project / 'mix.exs', 'defmodule Review.Umbrella do\n  use Mix.Project\n  def project, do: [apps_path: "apps", version: "0.1.0"]\nend\n')
              put(app / 'mix.exs', f'defmodule Review.Demo.MixProject do\n  use Mix.Project\n  def project, do: [app: :demo, version: "0.1.0", build_path: "../../_build", deps_path: "../../deps", lockfile: "../../mix.lock", elixirc_paths: {paths}]\nend\n')
              if name != 'empty-application':
                  put(app / 'lib/target.ex', 'defmodule Pramana.Release do\n  def current_id, do: "fixture"\nend\n')
                  put(app / 'lib/caller.ex', 'defmodule Review.Caller do\n  def run, do: Pramana.Release.current_id()\nend\n')
              put(root / '.gitignore', '**/_build/\n**/deps/\n**/generated/\n')
              put(root / 'mise.toml', '[tools]\nelixir = "1.20.3-otp-29"\nerlang = "29.0.5"\n')
              put(root / '.github/workflows/ci.yml', workflow)
              run(['git', 'init', '-q'], root)
              run(['git', 'config', 'user.name', 'isolated-review-fixture'], root)
              run(['git', 'config', 'user.email', 'fixture@example.invalid'], root)
              run(['git', 'add', '.'], root)
              run(['git', 'commit', '-qm', 'synthetic fixture'], root)
              env = os.environ.copy()
              env['MIX_ENV'] = 'test'
              env['GITHUB_SHA'] = run(['git', 'rev-parse', 'HEAD'], root).stdout.strip()
              env['XREF_REPORT_DIR'] = str(work / ('reports-' + name))
              p = run(['mix', 'compile', '--force', '--warnings-as-errors'], project, env)
              print(f'COMPILE {name}: exit {p.returncode}\n{p.stdout}', flush=True)
              if name == 'ignored-generated':
                  put(app / 'generated/generated.ex', 'defmodule Review.Generated do\n  def run, do: :changed_after_compile\nend\n')
                  assert run(['git', 'status', '--porcelain'], root).stdout == ''
              if name == 'empty-application':
                  p = run(['mix', 'xref', 'graph', '--no-compile', '--format', 'json', '--output', '-'], app, env, check=False)
                  print('EMPTY NATIVE XREF:', p.returncode, p.stdout, flush=True)
              p = run(['bash', '-c', collector], project, env, check=False)
              result = {'case': name, 'collector_exit': p.returncode, 'output': p.stdout}
              reports = pathlib.Path(env['XREF_REPORT_DIR'])
              graph_path = reports / 'demo/graph.json'
              if graph_path.exists():
                  result['graph'] = json.loads(graph_path.read_text())
              hashes = reports / 'source-files.sha256'
              if hashes.exists() and 'graph' in result:
                  hashed_paths = {line.split('  ', 1)[1] for line in hashes.read_text().splitlines()}
                  result['graph_sources_without_hashes'] = [os.path.relpath((app / source).resolve(), root) for source in result['graph'] if os.path.relpath((app / source).resolve(), root) not in hashed_paths]
              print(json.dumps(result, indent=2), flush=True)
              summary.append(result)
              if name == 'baseline':
                  assert result['collector_exit'] == 0
                  p = run(['bash', '-c', caller_command], root, env)
                  assert 'lib/caller.ex' in p.stdout
                  print('BASELINE CALLERS:', p.stdout, flush=True)
                  manifest = project / '_build/test/lib/demo/.mix/compile.elixir'
                  manifest.rename(manifest.with_name('saved.compile.elixir'))
                  p = run(['bash', '-c', caller_command], root, env, check=False)
                  print('MISSING-MANIFEST CALLER LOOP:', p.returncode, repr(p.stdout), flush=True)
          assert run(['git', 'rev-parse', 'HEAD'], checkout).stdout.strip() == '734541768db1afda902867cf47f16730f1bc564b'
          assert run(['git', 'status', '--porcelain'], checkout).stdout == ''
          print('Original candidate checkout unchanged.', flush=True)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## PR #10 adversarial compiler fixtures\n\nExact candidate collector; real Elixir 1.20.3 / OTP 29.0.5. No product runtime, database, Foundry or provider started. Full native output is in the job log.\n\n|Case|Collector exit|Graph sources without source hashes|\n|---|---:|---|\n')
              for r in summary:
                  f.write(f"|{r['case']}|{r['collector_exit']}|{r.get('graph_sources_without_hashes', 'not collected')}|\n")
          PY
