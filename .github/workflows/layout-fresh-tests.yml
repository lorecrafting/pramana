name: Layout fresh-database tests
on:
  push:
    branches: [audit/sibling-layout-source-2026-09-15]
    paths: [.github/workflows/layout-fresh-tests.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pramana
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      MIX_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fd880145c4f36b354cb632b8b47f9bc980b48aa4
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the same pg_bigm version into the isolated server
        run: |
          docker exec $(docker ps --filter "ancestor=pgvector/pgvector:pg18" --format "{{.ID}}") \
            bash -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends build-essential postgresql-server-dev-18 wget ca-certificates && wget -q https://github.com/pgbigm/pg_bigm/archive/refs/tags/v1.2-20250903.tar.gz && tar zxf v1.2-20250903.tar.gz && cd pg_bigm-1.2-20250903 && make USE_PGXS=1 with_llvm=no && make USE_PGXS=1 with_llvm=no install"
      - name: Restore existing project build cache when available
        uses: actions/cache@v4
        with:
          path: |
            pramana/deps
            pramana/_build
            pramana/priv/plts
            ~/.cargo
            pramana/apps/pramana_native/native/pramana_native/target
            pramana/native/quotations/target
          key: ${{ runner.os }}-pramana-layout-v2-${{ hashFiles('pramana/mix.lock', 'pramana/**/Cargo.lock', 'mise.toml') }}
          restore-keys: ${{ runner.os }}-pramana-layout-v2-
      - run: mix deps.get
      - name: Run unmodified application tests with the new umbrella bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mix test 2>&1 | tee "$RUNNER_TEMP/layout-application-tests.log"
      - name: Save test evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-application-tests
          path: ${{ runner.temp }}/layout-application-tests.log
          retention-days: 1
          if-no-files-found: warn
