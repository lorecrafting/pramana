# Validation-only branch: do not merge this workflow into the product PR.
# Read-only checkout of the exact candidate; no cache, providers, corpus or deployment.
name: Release provenance clean validation

on:
  push:
    branches: [work/pramana-release-validation-2026-09-15]
    paths: [.github/workflows/release-provenance-validation.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pramana
        shell: bash
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9c68b0efae635b6c198027a756b26097aba7fbf8
          persist-credentials: false
      - name: Verify exact clean source
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9c68b0efae635b6c198027a756b26097aba7fbf8
          test "$(git rev-parse HEAD^{tree})" = 8f59bfa85446219ecf25975447035ace622677ca
          test -z "$(git status --porcelain)"
          git show -s --format='source=%H%ntree=%T'
          test ! -e pramana/_build
          test ! -e pramana/deps
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.3-otp-29'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Install extension in this job's owned database only
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$POSTGRES_CONTAINER" bash -c '
            set -euo pipefail
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends build-essential postgresql-server-dev-18 wget ca-certificates
            wget -q https://github.com/pgbigm/pg_bigm/archive/refs/tags/v1.2-20250903.tar.gz
            tar zxf v1.2-20250903.tar.gz
            cd pg_bigm-1.2-20250903
            make USE_PGXS=1 with_llvm=no
            make USE_PGXS=1 with_llvm=no install
          '
      - name: Restore locked dependencies and compile from source
        run: |
          set -euo pipefail
          mix deps.get --check-locked
          mix compile --warnings-as-errors
          mix format --check-formatted
      - name: Exercise the three changed regression suites
        run: |
          set -euo pipefail
          mix test apps/pramana/test/pramana/release_test.exs apps/pramana_web/test/pramana_web/mcp/reply_test.exs apps/pramana_web/test/pramana_web/mcp/errors_test.exs --seed 615
      - name: Run the full umbrella suite
        run: |
          set -euo pipefail
          mix test --seed 616
      - name: Verify source remained unchanged
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9c68b0efae635b6c198027a756b26097aba7fbf8
          test "$(git rev-parse HEAD^{tree})" = 8f59bfa85446219ecf25975447035ace622677ca
          git diff --exit-code
          test -z "$(git status --porcelain)"
