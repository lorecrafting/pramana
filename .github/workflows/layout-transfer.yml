name: Validate sibling layout transport
# Temporary audit branch only. Final PR commits are published separately and have
# no transport files/workflows in their trees or ancestry.
on:
  push:
    branches: [audit/sibling-layout-source-2026-09-15]
    paths: [.github/workflows/layout-transfer.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
          install-hex: false
          install-rebar: false
      - name: Reconstruct and verify reviewed Git objects, without running a migration program
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, bz2, hashlib, json, os, pathlib, subprocess, tempfile
          def git(*args, data=None, env=None):
              return subprocess.check_output(['git', *args], input=data, env=env).strip()
          def blob_hash(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          parts = [pathlib.Path(f'.github/layout-part{i}.b64').read_text().strip() for i in range(1, 5)]
          # Part 3 acquired an eleven-character duplicate during text transport.
          # Accept only a repair that reproduces its exact pre-reviewed blob hash.
          expected = 'e89c80e0645200ecabc33da617a03895ff98e72f'
          if blob_hash(parts[2].encode()) != expected:
              p = parts[2]
              assert blob_hash(p.encode()) == 'c8b12ae448506ccc36fbe2120e2c2e2268b5c17b'
              matches = {p[:i] + p[i+11:] for i in range(len(p)-10)
                         if blob_hash((p[:i]+p[i+11:]).encode()) == expected}
              assert len(matches) == 1, 'Transport correction did not reproduce reviewed bytes'
              parts[2] = matches.pop()
          raw = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'dd86d5ddad346433f8b2560bd606728b93ea81fe24b2d4bd0051ad51f7a3e922'
          m = json.loads(raw)
          assert m['base'] == '8d4e8ee5513dc631538f638fdf53e0678c8dc370'
          def entries(ref):
              result = {}
              output = subprocess.check_output(['git','ls-tree','-r','-z',ref])
              for record in output.split(b'\0'):
                  if not record: continue
                  header, path = record.split(b'\t',1)
                  mode, kind, sha = header.decode().split()
                  assert kind == 'blob'
                  result[path.decode()] = [mode, sha]
              return result
          base = entries(m['base'])
          current = entries('HEAD')
          assert all(p.startswith('.github/') for p in set(base)|set(current)
                     if base.get(p) != current.get(p)), 'Unexpected source changes on transport branch'
          def make_tree(items):
              index = tempfile.mktemp(prefix='layout-index-', dir=os.environ['RUNNER_TEMP'])
              env = dict(os.environ, GIT_INDEX_FILE=index)
              git('read-tree','--empty',env=env)
              data = b''.join(f'{mode} {sha}\t{p}\0'.encode()
                              for p,(mode,sha) in sorted(items.items()))
              git('update-index','-z','--index-info',data=data,env=env)
              tree = git('write-tree',env=env).decode()
              pathlib.Path(index).unlink(missing_ok=True)
              return tree
          moves = m['moves']
          assert len(moves) == 533 and len(set(moves.values())) == 533
          mechanical = {moves.get(p,p): value for p,value in base.items()}
          assert len(mechanical) == len(base)
          mechanical_tree = make_tree(mechanical)
          assert mechanical_tree == m['mechanical_tree'] == '7967cd62922b99cb230d0e016f8bf73ca4690851'
          final = dict(mechanical)
          for path,(mode,expected_sha,edits) in m['patches'].items():
              assert not path.startswith('/') and '..' not in pathlib.PurePosixPath(path).parts
              old = subprocess.check_output(['git','cat-file','blob',mechanical[path][1]]) if path in mechanical else b''
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start,end,replacement in reversed(edits):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              content = ''.join(lines).encode('utf-8')
              sha = git('hash-object','-w','--stdin',data=content).decode()
              assert sha == expected_sha, f'Candidate mismatch: {path}'
              assert mode in ['100644','100755']
              final[path] = [mode,sha]
          assert m['deletions'] == []
          protected = [p for p in base if p.startswith('foundry/') or p in ['docs/PLAN.md','docs/ROADMAP.md']]
          assert len(protected) == 240
          assert all(final[p] == base[p] for p in protected)
          final_tree = make_tree(final)
          assert final_tree == m['final_tree'] == '50fd1228f0e4a48bd5645dae8b9c3a39e8396d94'
          for key,value in [('user.name','github-actions[bot]'),('user.email','41898282+github-actions[bot]@users.noreply.github.com')]:
              git('config',key,value)
          candidate = git('commit-tree',final_tree,'-p',m['base'],data=b'Isolated layout validation candidate\n').decode()
          worktree = pathlib.Path(os.environ['RUNNER_TEMP'])/'linked layout validation'
          git('worktree','add','--detach',str(worktree),candidate)
          subprocess.run(['mix','format','--check-formatted'],cwd=worktree,check=True)
          subprocess.run(['elixir','bin/check_docs.exs'],cwd=worktree,check=True)
          subprocess.run(['elixir','bin/check_local_layout.exs'],cwd=worktree,check=True)
          git('diff','--check',m['base'],candidate)
          # Actions does not publish workflow changes. Retain this branch's .github
          # bytes exactly; the authorized connector will assemble clean PR commits.
          gh = {p:v for p,v in current.items() if p.startswith('.github/')}
          def transport_tree(items):
              return make_tree({**{p:v for p,v in items.items() if not p.startswith('.github/')}, **gh})
          t1 = transport_tree(mechanical)
          c1 = git('commit-tree',t1,'-p',os.environ['GITHUB_SHA'],data=b'chore: transport verified mechanical layout objects\n').decode()
          t2 = transport_tree(final)
          c2 = git('commit-tree',t2,'-p',c1,data=b'chore: transport verified sibling-layout source objects\n').decode()
          assert git('diff','--name-only',os.environ['GITHUB_SHA'],c2,'--','.github/') == b''
          branch = 'audit/sibling-layout-source-2026-09-15'
          remote = git('ls-remote','origin','refs/heads/'+branch).decode().split()[0]
          assert remote == os.environ['GITHUB_SHA'], 'Concurrent update: stop, do not overwrite'
          git('push','origin',c2+':refs/heads/'+branch)
          report = {'base':m['base'],'mechanical_tree':mechanical_tree,'final_tree':final_tree,
                    'transport_mechanical_tree':t1,'transport_final_tree':t2,
                    'transport_mechanical_commit':c1,'transport_final_commit':c2,
                    'moves':len(moves),'protected':len(protected),'checks':39}
          print(json.dumps(report,indent=2))
          pathlib.Path(os.environ['RUNNER_TEMP'],'layout-result.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sibling-layout-validation
          path: ${{ runner.temp }}/layout-result.json
          retention-days: 1
          if-no-files-found: error
