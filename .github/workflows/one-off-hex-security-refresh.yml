name: One-off Hex security refresh

on:
  push:
    branches:
      - fix/security-hex-advisories-2026-09-16

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pramana
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-hex-advisories-2026-09-16
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      - name: Resolve only the advisory fixes
        run: |
          set -euo pipefail
          mix deps.unlock bandit mint
          mix deps.get
          mix hex.audit

      - name: Commit resolver-owned lockfile
        run: |
          set -euo pipefail
          git diff --exit-code -- mix.lock && {
            echo "Expected security refresh to change mix.lock" >&2
            exit 1
          }
          git diff --check -- mix.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.lock
          git commit -m "security: refresh Bandit and Mint advisories"
          git push origin HEAD:fix/security-hex-advisories-2026-09-16
