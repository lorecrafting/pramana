name: Prepare sibling layout candidate
on:
  push:
    branches: [work/sibling-layout-prepare-2026-09-15]
    paths: [.github/workflows/layout-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
      - name: Verify and apply reviewed source migration
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, bz2, hashlib, subprocess, re, posixpath
          moved='672dc4a4687973ddf7805c5c4a05f3d426c1e846'
          allowed={'.github/workflows/ci.yml','.github/workflows/layout-build.yml','.github/workflows/layout-prepare.yml'}
          allowed.update(f'.github/layout-replay-part{i}.b64' for i in range(1,4))
          changed=set(subprocess.check_output(['git','diff','--name-only',moved,'HEAD'],text=True).splitlines())
          assert changed <= allowed, changed-allowed
          parts=[Path(f'.github/layout-replay-part{i}.b64').read_text().strip() for i in range(1,4)]
          assert parts[1].count('VKFiK1WF')==1
          parts[1]=parts[1].replace('VKFiK1WF','VKFi1WF')
          source=bz2.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(source).hexdigest()=='e2ab18fae3f8d9756fa2b5afba892cb6b3f80acad073d36b542a21d2f56031d4'
          script=Path('/tmp/layout-replay.py'); script.write_bytes(source)
          subprocess.run(['python',str(script)],check=True)
          files=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          count=0
          for name in files:
              if not name.endswith('.md') or name.startswith('foundry/') or name in ('docs/PLAN.md','docs/ROADMAP.md'):continue
              p=Path(name)
              if not p.exists():continue
              text=p.read_text()
              def fix(m):
                  global count
                  target=m[1]
                  if re.match(r'^(?:[a-zA-Z][\w+.-]*:|/)',target):return m[0]
                  path,sep,fragment=target.partition('#')
                  dest=posixpath.normpath(posixpath.join(posixpath.dirname(name),path))
                  if dest.split('/')[0] not in ('apps','native','priv','config','rel','evals','sources'):return m[0]
                  new='pramana/'+dest
                  if not any(f==new or f.startswith(new+'/') for f in files):return m[0]
                  replacement=posixpath.relpath(new,posixpath.dirname(name))+(sep+fragment if sep else '')
                  count+=1
                  a=m.start(1)-m.start(0);b=m.end(1)-m.start(0)
                  return m[0][:a]+replacement+m[0][b:]
              new=re.sub(r'\[[^\]\n]*\]\(([^\s)]+)\)',fix,text)
              if new!=text:p.write_text(new)
          assert count==12,count
          subprocess.run(['git','diff','--exit-code','--','.github/workflows'],check=True)
          PY
      - name: Stage owned paths, format changed Elixir and verify protected files
        run: |
          set -euo pipefail
          git add -- pramana bin docs .gitignore .mcp.json AGENTS.md README.md foundry/AGENTS.md
          git diff --cached --name-only -z --diff-filter=ACM > /tmp/layout-format-paths
          elixir -e 'for p <- File.read!("/tmp/layout-format-paths") |> String.split(<<0>>, trim: true), Path.extname(p) in [".ex", ".exs"], do: File.write!(p, [Code.format_string!(File.read!(p)), "\n"])'
          git add -- pramana bin docs .gitignore .mcp.json AGENTS.md README.md foundry/AGENTS.md
          python - <<'PY'
          import subprocess
          base='8d4e8ee5513dc631538f638fdf53e0678c8dc370'
          paths=subprocess.check_output(['git','ls-tree','-r','--name-only',base,'--','foundry'],text=True).splitlines()+['docs/PLAN.md','docs/ROADMAP.md']
          for p in paths:
              assert subprocess.check_output(['git','show',f'{base}:{p}'])==subprocess.check_output(['git','show',f':{p}']),p
          print(f'{len(paths)} protected paths byte-identical')
          PY
      - name: Model-free source, documentation and wrapper checks
        run: |
          set -euo pipefail
          elixir bin/check_docs.exs
          git diff --cached --check
      - name: Commit and publish only this temporary branch
        run: |
          set -euo pipefail
          branch=work/sibling-layout-prepare-2026-09-15
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: validate explicit sibling project and data paths'
          git push origin "HEAD:refs/heads/$branch"
      - name: Capture candidate source and uncommitted changes
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/layout-result"
          git rev-parse HEAD > "$RUNNER_TEMP/layout-result/commit.txt"
          git write-tree > "$RUNNER_TEMP/layout-result/tree.txt"
          git bundle create "$RUNNER_TEMP/layout-result/repository.bundle" HEAD
          git diff --cached --binary > "$RUNNER_TEMP/layout-result/staged.patch"
          git diff --binary > "$RUNNER_TEMP/layout-result/unstaged.patch"
          git status --short > "$RUNNER_TEMP/layout-result/status.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sibling-layout-result
          path: ${{ runner.temp }}/layout-result
          retention-days: 1
          if-no-files-found: error
