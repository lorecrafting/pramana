# Continuous integration for Pramāṇa.
#
# WHAT THIS CAN AND CANNOT CHECK, because the difference is the point.
#
# This runs the mechanical half of `mix pramana.gate --quick`: formatting, Credo, and the
# full test suite. It CANNOT run `verify`, `integrity` or `evals`, and it never will:
# those check the baked corpus, and the corpus is not here. `raw/` is gitignored and the
# licensing posture is that we publish the pipeline, not the corpus — CBETA is
# non-commercial and each user bakes their own copy. A CI job that pretended to gate the
# corpus would need a corpus, and putting one in a public runner would break the licence
# this project is careful about.
#
# So the split is honest rather than incidental:
#
#   here          format, credo, application/native tests and release build
#   on a machine  mix pramana.gate                      verify, integrity, evals, lockfile
#                 with the bake
#
# `docs/CHECKS.md` is the full gate. This is the part a pull request can prove.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A second push to the same branch makes the first run irrelevant. Cancelling it is not
# just thrift: two runs of the same suite against one Postgres service is contention, and
# this project has already learned that contention invalidates timings.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pramana

    services:
      postgres:
        # pgvector's own image, because the alternative is building the extension inside a
        # service container, which cannot be done from a workflow step. pg_bigm is
        # installed into it below.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Matches config/test.exs. Stated here rather than assumed, so a change to either
      # fails loudly instead of connecting to the wrong database.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4

      # EXACT versions, from mise.toml. The toolchain is pinned for the same reason the
      # corpus is: a build that cannot be reproduced is not a build. If these drift from
      # mise.toml, CI is testing something the developer is not running.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"

      # The Rustler NIF (CJK segmentation via jieba-rs) is compiled from source.
      # Rust remains the existing floating stable selection. Pinning it is a
      # separate toolchain decision, not a hidden change in this path migration.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install pg_bigm
        # NOT pg_trgm, which ships with Postgres. `pg_bigm` indexes BIGRAMS, and the
        # two-character queries that dominate Classical Chinese cannot use a trigram index
        # at all — see docs/ELIXIR.md. The migration creates the extension, so it has to
        # exist in the server first.
        run: |
          docker exec $(docker ps --filter "ancestor=pgvector/pgvector:pg18" --format "{{.ID}}") \
            bash -c "apt-get update -qq && apt-get install -y -qq --no-install-recommends \
              build-essential postgresql-server-dev-18 wget ca-certificates && \
              wget -q https://github.com/pgbigm/pg_bigm/archive/refs/tags/v1.2-20250903.tar.gz && \
              tar zxf v1.2-20250903.tar.gz && cd pg_bigm-1.2-20250903 && \
              make USE_PGXS=1 with_llvm=no && make USE_PGXS=1 with_llvm=no install"

      - name: Restore deps and build
        uses: actions/cache@v4
        with:
          path: |
            pramana/deps
            pramana/_build
            pramana/priv/plts
            ~/.cargo
            pramana/apps/pramana_native/native/pramana_native/target
            pramana/native/quotations/target
          key: ${{ runner.os }}-pramana-layout-v2-${{ hashFiles('pramana/mix.lock', 'pramana/**/Cargo.lock', 'mise.toml') }}
          restore-keys: ${{ runner.os }}-pramana-layout-v2-

      - run: mix deps.get

      # Warnings-as-errors on the project's own code. A warning that nobody has to fix is
      # a warning everybody stops reading.
      - id: compile
        run: mix compile --force --warnings-as-errors

      - run: mix format --check-formatted

      - run: mix credo --strict

      - name: Lint shared repository checks with the same rules
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix credo --strict --files-included '../test/**/*.exs' --files-included '../bin/*.exs'

      - name: Deps audit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix deps.audit

      - name: Dialyzer
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix dialyzer

      - name: Cargo audit
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          if ! command -v cargo-audit &>/dev/null; then
            cargo install cargo-audit --locked
          fi
          cargo audit --file apps/pramana_native/native/pramana_native/Cargo.lock
          cargo audit --file native/quotations/Cargo.lock

      - name: Test native quotation companion
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: cargo test --locked --manifest-path native/quotations/Cargo.toml

      # Collect migration acceptance even when a separate quality check fails.
      # No continue-on-error: preceding failures still fail this job.
      - name: Test the Pramana umbrella
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: mix test

      - name: Build production assets and release without starting it
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://postgres:postgres@localhost/pramana_build_only
          SECRET_KEY_BASE: build-only-not-used-to-start-a-server-00000000000000000000000000000000
        run: |
          mix deps.get --only prod
          mix assets.deploy
          mix release --overwrite
