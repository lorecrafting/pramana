name: Documentation audit snapshot

# Temporary read-only transport for this audit branch; removed before review.
on:
  push:
    branches: [docs/provider-neutral-audit-2026-09-15]
    paths: [.github/workflows/docs-audit-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive tracked source only, without running project code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-audit"
          git rev-parse HEAD > "$RUNNER_TEMP/docs-audit/commit.txt"
          git ls-files > "$RUNNER_TEMP/docs-audit/tracked-files.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/docs-audit/source.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: documentation-audit-source
          path: ${{ runner.temp }}/docs-audit
          if-no-files-found: error
          retention-days: 1
