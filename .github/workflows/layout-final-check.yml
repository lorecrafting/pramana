name: Validate final layout fixes
on:
  push:
    branches: [work/sibling-layout-final-check-2026-09-15]
    paths: [.github/workflows/layout-final-check.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
      - name: Apply hash-verified minimal patch
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,bz2,hashlib,subprocess
          from pathlib import Path
          base='86e94f683c5dc4ab9dd75ea69cd1e99bb378fbd6'
          assert subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()==['.github/workflows/layout-final-check.yml']
          payload=''
          patch=bz2.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='27af7c907760779635d3a491f676dfaa854a0789b0099f41c7792c6379af2545'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          path=Path('pramana/Dockerfile'); text=path.read_text()
          old='# The former 20250630 combination was never published for this Elixir/OTP pair.'
          assert text.count(old)==1
          path.write_text(text.replace(old,'# The former 20250630 combination is absent from the registry for this pair.'))
          PY
      - name: Format only the four changed Elixir files and run checks
        run: |
          set -euo pipefail
          git diff --name-only -z > /tmp/layout-final-paths
          elixir -e 'for p <- File.read!("/tmp/layout-final-paths") |> String.split(<<0>>, trim: true), Path.extname(p) in [".ex", ".exs"], do: File.write!(p, [Code.format_string!(File.read!(p)), "\n"])'
          git add -- pramana/apps/pramana/lib/mix/tasks/pramana.integrity.ex pramana/apps/pramana/lib/pramana/paths.ex pramana/apps/pramana/test/docs/routing_test.exs pramana/apps/pramana/test/pramana/paths_test.exs pramana/Dockerfile
          elixir bin/check_docs.exs
          git diff --cached --check
      - name: Publish only this temporary branch after concurrent-head check
        run: |
          set -euo pipefail
          branch=work/sibling-layout-final-check-2026-09-15
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: make local integrity paths explicit and keep verification helpers shallow'
          git push origin "HEAD:refs/heads/$branch"
