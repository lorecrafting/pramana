name: One-off format release v2

on:
  push:
    branches:
      - fix/release-content-identity-v2-2026-09-16

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pramana
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-content-identity-v2-2026-09-16
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
      - run: mix deps.get
      - name: Format umbrella
        run: mix format
      - name: Commit formatter output
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .; then
            echo "No formatter diff"
            exit 0
          fi
          git add -u .
          git commit -m "style: format release identity v2 changes"
          git push origin HEAD:fix/release-content-identity-v2-2026-09-16
