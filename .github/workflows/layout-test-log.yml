name: Layout test diagnostics
on:
  push:
    branches: [work/layout-test-log-2026-09-15]
    paths: [.github/workflows/layout-test-log.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the completed test job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, re, pathlib, urllib.request
          class StorageRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected=super().redirect_request(req,fp,code,msg,headers,newurl)
                  if redirected is not None:
                      redirected.remove_header('Authorization')
                  return redirected
          opener=urllib.request.build_opener(StorageRedirect)
          url='https://api.github.com/repos/lorecrafting/pramana/actions/jobs/104599969772/logs'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with opener.open(request,timeout=45) as response:
              raw=response.read()
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'diagnostics'
          out.mkdir()
          (out/'job.log').write_bytes(raw)
          text=raw.decode('utf-8-sig')
          text=re.sub(r'\x1b\[[0-9;]*m','',text)
          text=re.sub(r'^\d{4}-\d\d-\d\dT\S+\s*','',text,flags=re.M)
          lines=text.splitlines()
          selected=[]
          for i,line in enumerate(lines):
              if re.match(r'^\s*\d+\) test ',line):
                  selected.extend(lines[i:i+16])
              if re.search(r'\d+ tests, \d+ failures',line):
                  selected.append(line)
          summary='\n'.join(selected)
          (out/'failures.txt').write_text(summary)
          print(summary)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-test-diagnostics
          path: ${{ runner.temp }}/diagnostics
          retention-days: 1
          if-no-files-found: error
