name: Layout container candidate
on:
  push:
    branches: [audit/sibling-layout-source-2026-09-15]
    paths: [.github/workflows/layout-container-check.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 25737731bc35c657d72ff786d67d1acf4f0452ee
          persist-credentials: false
      - name: Build exact source with the registry-verified Debian revision
        run: docker build --progress=plain --build-arg DEBIAN_VERSION=bookworm-20260824-slim -f pramana/Dockerfile -t pramana:layout-validation pramana
