name: Apply test audit CI follow-ups
on:
  pull_request:
    paths: [".github/workflows/test-audit-fix.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'test/behavior-first-audit-2026-09-15'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply only digest-verified source edits
        env:
          DELTA: ''
        run: |
          python3 - <<'PY'
          import os,base64,lzma,json,hashlib,pathlib,subprocess
          base='aec41d84b77d4c5d11e7bed184dc74520b6cd162'
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == {'.github/workflows/test-audit-fix.yml'}, changed
          packed=base64.b64decode(os.environ['DELTA'],validate=True)
          assert hashlib.sha256(packed).hexdigest() == '78b6e1ca26c4ad812c205ea8e3b8797d65f7c72c824dc3d623796d3e6a2d1034'
          delta=json.loads(lzma.decompress(packed)); assert delta['base']==base
          updates=[]
          for c in delta['changes']:
              p=pathlib.Path(c['path']); assert p.parts[0] in ['pramana','foundry'] and '..' not in p.parts and not p.is_symlink()
              old=p.read_bytes(); assert hashlib.sha256(old).hexdigest()==c['old'], str(p)
              lines=old.decode().splitlines(keepends=True)
              for start,end,text in reversed(c['edits']): lines[start:end]=text.splitlines(keepends=True)
              new=''.join(lines).encode(); assert hashlib.sha256(new).hexdigest()==c['new'], str(p)
              updates.append((p,new))
          for p,new in updates: p.write_bytes(new)
          print(f'Applied {len(updates)} verified CI follow-ups')
          PY
          git add pramana foundry
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: isolate CLI startup and wait for the actual ownership boundary'
          git push origin HEAD:refs/heads/test/behavior-first-audit-2026-09-15
