name: Documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
      - name: Check documentation without corpus, providers or dependencies
        run: |
          mix format --check-formatted
          elixir bin/check_docs.exs
          elixir bin/check_pilot_preflight.exs --validate
          elixir bin/check_pilot_acceptance.exs --validate
          elixir bin/check_pilot_participants.exs --validate
          elixir bin/sync_agent_conventions.exs --check
