name: Pramana container
on:
  pull_request:
    paths:
      - "pramana/Dockerfile"
      - "pramana/.dockerignore"
      - "pramana/mix.exs"
      - "pramana/mix.lock"
      - "pramana/config/**"
      - "pramana/rel/**"
      - "pramana/apps/**"
      - "pramana/ci/release_smoke.py"
      - "pramana/ci/serving_privileges.exs"
      - ".github/workflows/pramana-container.yml"
  push:
    branches: [main]
    paths:
      - "pramana/Dockerfile"
      - "pramana/.dockerignore"
      - "pramana/mix.exs"
      - "pramana/mix.lock"
      - "pramana/config/**"
      - "pramana/rel/**"
      - "pramana/apps/**"
      - "pramana/ci/release_smoke.py"
      - "pramana/ci/serving_privileges.exs"
      - ".github/workflows/pramana-container.yml"
permissions:
  contents: read
concurrency:
  group: pramana-container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build exact Pramana runtime image with reusable layers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pramana
          file: pramana/Dockerfile
          load: true
          tags: pramana:ci
          cache-from: type=gha,scope=pramana-runtime-image
          cache-to: type=gha,mode=max,scope=pramana-runtime-image,ignore-error=true
      - name: Exercise the shipped release with disposable synthetic databases
        run: python3 pramana/ci/release_smoke.py --image pramana:ci --output "${{ runner.temp }}/release-smoke"
      - name: Retain runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-smoke
          if-no-files-found: error
          retention-days: 7
